{% extends "dashboard/navbar-layout.html" %}
{% load static %}

{% block content %}
<head>
    <link rel="stylesheet" href="{% static 'css/dashboard/dashboard.css' %}">
</head>

<main>
    <section class="container-1">
        <div class="admin-view">
            <div class="welcome-page">
                <h1>Welcome back Admin</h1>
                <p>Here is what happening with your store today</p>
            </div>

            <div class="computer-img">
                <img src="{% static 'images/laptop.png' %}" alt="pc">
            </div>
        </div>
    </section>

    <section>
        <div class="container">

        <div class="card-1">
            <h5>Sales Overview</h5>
            <canvas id="salesChart"></canvas>
        </div>

       <div class="card-2">
           <h5>Order Status</h5>

           <div class="order-container">
               <div class="chart">
                   <canvas id="orderStatusChart"></canvas>
                   <div class="chart-center">
                        <h2>320</h2>
                        <p>Total Orders</p>
                    </div>
                </div>

                <div class="order-details">
                    <div class="status">
                        <div>
                            <span class="dot pending"></span>
                            Pending
                        </div>
                    </div>

                    <div class="status">
                        <div>
                            <span class="dot processing"></span>
                            Processing
                        </div>
                    </div>
                    <div class="status">
                        <div>
                            <span class="dot shipped"></span>
                            Shipped
                        </div>
                    </div>
                    <div class="status">
                        <div>
                            <span class="dot delivered"></span>
                            Delivered
                        </div>
                    </div>

                    <div class="status">
                        <div>
                            <span class="dot cancelled"></span>
                            Cancelled
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </div>
    </section>

    <section>
        <div class="">
            <div class="box-1">Card 1</div>
            <div class="box-2">Card 2</div>
            <div class="box-3">Card 3</div>
            <div class="box-4">Card 4</div>
        </div>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{% static 'js/dashboard.js' %}"></script>
{% endblock content %}
