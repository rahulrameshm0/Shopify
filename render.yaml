# Render blueprint for this repo.
# NOTE: the live service (https://shopify-b5g9.onrender.com) was created through
# the Render CLI and uses SQLite, because the workspace's single free Postgres
# slot is taken by another app. This file mirrors that setup so the config is
# reproducible.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shopify
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # Ephemeral SQLite: data is recreated from core/fixtures on every deploy.
      # Swap this for a Postgres connection string if you upgrade the database.
      - key: DATABASE_URL
        value: sqlite:////opt/render/project/src/db.sqlite3
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Optional secrets.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
