# Render blueprint: web service + managed PostgreSQL.
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: shopify-db
    plan: free
    databaseName: shopify
    user: shopify
    postgresMajorVersion: "17"

services:
  - type: web
    name: shopify
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn ecommerce.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: shopify-db
          property: connectionString
      # Optional secrets: set these in the Render dashboard.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

    # Free instances have an ephemeral filesystem: uploaded product images and
    # profile pictures are lost on restart/deploy. To persist them, upgrade to a
    # paid plan and mount a disk:
    #
    # disk:
    #   name: media
    #   mountPath: /var/data
    #   sizeGB: 1
    #
    # ...then add:
    #   - key: MEDIA_ROOT
    #     value: /var/data/media
